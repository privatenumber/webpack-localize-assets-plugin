name: Release

on:
  push:
    branches: master

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2.2.2
      with:
        version: 7
        run_install: true

    - name: Build
      run: pnpm build

    - name: Test
      env:
        NODE_OPTIONS: --openssl-legacy-provider
      run: pnpm test

    - name: Lint
      run: pnpm lint

    - name: Release
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: pnpm dlx semantic-release
